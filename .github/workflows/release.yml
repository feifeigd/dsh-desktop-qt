# ============================================================
#  DSH Desktop - Build & Release workflow
#
#  Trigger:
#    * push tag vX.Y.Z  -> builds installer, publishes GitHub Release
#    * manual dispatch  -> builds installer, uploads as artifact only
#
#  Output: dist/DSHDesktop-Setup-<version>.exe (NSIS one-click installer,
#  bundles Qt shell + embedded portable Node + dsh harness, zero client env)
#
#  Notes:
#    * Runs on windows-latest (needs MSVC 2022 + Qt msvc2022_64)
#    * CI runs in GitHub's US datacenters -> npm official registry is used
#      here (fastest). The npmmirror default lives in runtime/tools/update.js
#      for end users in CN.
#    * The dsh node_modules tree is cached so tag rebuilds skip the
#      ~15min npm install.
# ============================================================
name: Build & Release

on:
  # Push to main -> build + upload artifact (CI check, no Release)
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (artifact only, no GitHub Release)'
        required: false
        default: '0.1.0'

permissions:
  contents: write

env:
  # CI uses Qt 6.10.3 (latest 6.10 patch, old repo layout that aqt 3.3.0
  # supports). Qt 6.11+ switched the online repo to per-toolchain dirs
  # (qt6_6111_msvc2022_64/) which aqt 3.3.0 cannot read yet. API-compatible
  # with the 6.11.1 used for local dev builds.
  QT_VERSION: '6.10.3'        # matches local build (Qt msvc2022_64)
  NODE_VERSION: '24.9.0'      # embedded portable Node (win-x64)
  DSH_VERSION: '0.1.0-rc.6'   # @deepseek-ai/dsh harness version

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $v = '${{ github.ref_name }}' -replace '^v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          "value=$v" | Out-File -Append $env:GITHUB_OUTPUT
          "is_prerelease=$([bool]($v -match 'rc|beta|alpha|pre'))" | Out-File -Append $env:GITHUB_OUTPUT
          Write-Output "Building version: $v"

      # --- Qt 6.11.1 msvc2022_64 + WebEngine (installs to C:\Qt, same
      #     layout as the local build machine) ------------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          # Fixed dir so downstream steps can use known paths
          # (C:\Qt\<ver>\msvc2022_64) instead of action env vars.
          dir: 'C:/Qt'
          # Qt 6.10+ merged qtdeclarative into qtbase; qtwebengine pulls in
          # qtwebchannel + qtpositioning as hard deps.
          modules: qtwebengine qtwebchannel qtpositioning
          cache: true

      # --- Embedded portable Node (zero client env) -------------------
      - name: Download portable Node
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\node.zip"
          curl.exe -L --retry 3 -o $zip "https://nodejs.org/dist/v$env:NODE_VERSION/node-v$env:NODE_VERSION-win-x64.zip"
          tar -xf $zip -C "$env:RUNNER_TEMP"
          New-Item -ItemType Directory -Force deploy\runtime\node | Out-Null
          Copy-Item "$env:RUNNER_TEMP\node-v$env:NODE_VERSION-win-x64\*" deploy\runtime\node -Recurse -Force
          Get-Item deploy\runtime\node\node.exe, deploy\runtime\node\node_modules\npm\bin\npm-cli.js | Select-Object Name, Length

      # --- Stage deploy dir: tools, TS plugin (prebuilt), VC++ redist --
      - name: Stage deploy extras
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy\runtime\tools, deploy\tsplugins | Out-Null
          Copy-Item runtime\tools\* deploy\runtime\tools\ -Force
          Copy-Item tsplugins\dsh-desktop-demo deploy\tsplugins\ -Recurse -Force
          # aka.ms CDN can drop mid-transfer; retry on any error and
          # verify the file is actually complete (~25MB).
          curl.exe -L --retry 5 --retry-all-errors --retry-delay 3 -o deploy\vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe
          if ($LASTEXITCODE -ne 0) { throw "vc_redist download failed: $LASTEXITCODE" }
          $vcr = Get-Item deploy\vc_redist.x64.exe
          if ($vcr.Length -lt 10MB) { throw "vc_redist incomplete: $($vcr.Length) bytes" }
          Get-Item deploy\runtime\tools\provision.js, deploy\runtime\tools\update.js, deploy\tsplugins\dsh-desktop-demo\lib\index.js, deploy\vc_redist.x64.exe | Select-Object Name, Length

      # --- dsh harness (win32 native modules resolved by npm) ---------
      - name: Cache dsh node_modules
        id: dsh-cache
        uses: actions/cache@v4
        with:
          path: deploy/runtime/dsh/node_modules
          key: dsh-${{ env.DSH_VERSION }}-${{ runner.os }}

      - name: Install dsh harness
        if: steps.dsh-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy\runtime\dsh | Out-Null
          Set-Location deploy\runtime\dsh
          & "..\node\node.exe" "..\node\node_modules\npm\bin\npm-cli.js" init -y | Out-Null
          & "..\node\node.exe" "..\node\node_modules\npm\bin\npm-cli.js" install "@deepseek-ai/dsh@$env:DSH_VERSION" --no-audit --no-fund
          Set-Location $env:GITHUB_WORKSPACE

      - name: Verify dsh tree
        shell: pwsh
        run: |
          $nm = 'deploy\runtime\dsh\node_modules'
          $ds = Join-Path $nm '@deepseek-ai'
          Write-Output ("@deepseek-ai packages: " + (Get-ChildItem $ds -Directory | Measure-Object).Count)
          Write-Output ("dsh bin.js: " + (Test-Path (Join-Path $ds 'dsh\lib\bin.js')))
          Write-Output ("koffi-win32: " + (Test-Path (Join-Path $nm '@koromix\koffi-win32-x64')))
          Write-Output ("sharp-win32: " + (Test-Path (Join-Path $nm '@img\sharp-win32-x64')))
          $pty = Test-Path (Join-Path $nm 'node-pty')
          $pty2 = Test-Path (Join-Path $nm '@homebridge\node-pty-prebuilt-multiarch')
          Write-Output ("node-pty present: " + ($pty -or $pty2))

      # --- Qt shell build (MSVC via vcvarsall + Ninja, Release, WIN32) --
      - name: Configure & build
        shell: pwsh
        run: |
          # Locate VS dynamically with vswhere, then run the whole build
          # inside one vcvarsall cmd session - same recipe as the local
          # build-win.bat (never rely on a hardcoded VS edition).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "No Visual Studio with VC tools found" }
          Write-Output "VS installation: $vsPath"
          # Locate the Qt root by finding qmake under C:\Qt (the action's
          # dir arg nests an extra Qt folder, so don't hardcode the path).
          $qmake = Get-ChildItem 'C:\Qt' -Recurse -Filter qmake.exe -Depth 5 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'msvc2022_64' } | Select-Object -First 1
          if (-not $qmake) { throw "qmake not found under C:\Qt" }
          $qtRoot = $qmake.DirectoryName -replace '\\bin$', ''
          Write-Output "Qt root: $qtRoot"
          @"
          @echo off
          call "$vsPath\VC\Auxiliary\Build\vcvarsall.bat" x64
          if errorlevel 1 exit /b 1
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_PREFIX_PATH=$qtRoot"
          if errorlevel 1 exit /b 1
          cmake --build build-release --config Release
          if errorlevel 1 exit /b 1
          "@ | Set-Content -Path ci-build.cmd -Encoding ascii
          cmd /c ci-build.cmd
          if ($LASTEXITCODE -ne 0) { throw "Build failed (exit $LASTEXITCODE)" }

      # --- windeployqt + stage into deploy ----------------------------
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          $qmake = Get-ChildItem 'C:\Qt' -Recurse -Filter qmake.exe -Depth 5 -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'msvc2022_64' } | Select-Object -First 1
          if (-not $qmake) { throw "qmake not found under C:\Qt" }
          $qtRoot = $qmake.DirectoryName -replace '\\bin$', ''
          Copy-Item build-release\DSHDesktop.exe deploy\ -Force
          & "$qtRoot\bin\windeployqt.exe" --release --no-translations --no-system-d3d-compiler --no-opengl-sw deploy\DSHDesktop.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force deploy\plugins | Out-Null
          Copy-Item build-release\plugins\demo_plugin.dll deploy\plugins\ -Force
          Get-ChildItem deploy | Select-Object Name, Length | Format-Table -AutoSize

      # --- NSIS installer ----------------------------------------------
      - name: Patch NSI version
        shell: pwsh
        run: |
          $nsi = 'installer\dsh-desktop.nsi'
          $content = Get-Content $nsi -Raw
          $content = $content -replace 'APP_VERSION "[^"]*"', "APP_VERSION `"${{ steps.ver.outputs.value }}`""
          Set-Content $nsi $content -NoNewline -Encoding utf8
          Select-String -Path $nsi -Pattern 'APP_VERSION'

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /NOCD /V2 installer\dsh-desktop.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item dist\DSHDesktop-Setup-*.exe | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSHDesktop-Setup-${{ steps.ver.outputs.value }}
          path: dist/DSHDesktop-Setup-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DSHDesktop-Setup-*.exe
          prerelease: ${{ steps.ver.outputs.is_prerelease }}
          generate_release_notes: true
